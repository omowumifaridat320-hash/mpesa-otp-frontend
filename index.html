<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-PESA OTP Verification</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 10px; margin: 0; }
    .input-group { margin-bottom: 10px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #008CBA; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; }
    button:disabled { background-color: #cccccc; }
    .status { margin-top: 10px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <div class="input-group">
    <label for="phone">G. REGISTERED M-PESA PHONE NUMBER</label>
    <input type="text" id="phone" placeholder="e.g. 254712345678">
    <button id="send-btn" onclick="sendOtp()">Send OTP</button>
  </div>

  <div class="input-group" id="otp-section" style="display: none;">
    <label for="otp">Enter 6-Digit OTP</label>
    <input type="text" id="otp" placeholder="123456">
    <button id="verify-btn" onclick="verifyOtp()">Verify OTP</button>
  </div>

  <div id="status-msg" class="status"></div>

  <script src="widget.js"></script>
</body>
</html>
